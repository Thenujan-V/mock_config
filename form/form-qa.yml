spring:
  application:
    name: form
  banner:
    location: classpath:banner.txt
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auradocs_auradot?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${AURADOCS_DB_USERNAME:root}
    password: ${AURADOCS_DB_PASSWORD}
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update
    properties:
      hibernate:
        # form tables hold UTC instants; AuraDOCS tables keep Asia/Colombo local time
        jdbc:
          time_zone: UTC

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka-server/eureka
  instance:
    preferIpAddress: true
    instance-id: ${spring.application.name}-${random.int}

server:
  port: 0

management:
  tracing:
    sampling:
      probability: 1.0

openapi:
  service:
    title: Form Service
    description: Form (definitions, validation, submissions) micro service for the AuraDOCS V4
    version: 1.0.0-SNAPSHOT
    url: https://v4.auradocs.com/api
  contact:
    name: AuraDOT PVT Ltd.
    email: contact@auradot.com
springdoc:
  api-docs:
    path: /form/api-docs
  swagger-ui:
    path: /form/swagger-ui.html
