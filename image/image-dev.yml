spring:
  application:
    name: image
  # profiles:
  #   active: dev
  banner:
    location: classpath:banner.txt
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auradocs_auradot?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: Aura2528@
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
    # healthcheck:
    #   enabled: true
  instance:
    preferIpAddress: true
    instance-id: ${spring.application.name}-${random.int}
    # hostname: localhost

member:
  rent:
    min: 8
    max: 31
  price:
    discount: 3
vehicle:
  default:
    model: cross over
duration: all

site: 
  file-share:
    url: http://localhost:9191/share-doc/view/


server:
  port: 0

archive:
  location: /var/tmp/auradocsv4
  identity: archive_1
  pending-docs:
    location: /var/tmp/auradocsv4/pending_docs
  signature-img: signature
  thumbs-location: /var/tmp/auradocsv4/thumbs
temp:
  location: /var/tmp/auradocsv4/temp
  auto-sign: sign
combinedDocs:
  location: /var/tmp/auradocsv4/temp
bookmark: 
  location: /var/tmp/bookmark

link:
  external-viewer: https://v4.auradocs.com/viewer/

management: 
  tracing: 
    sampling: 
      probability: 1.0 
      
hystrix:
  timeout: 5000
  
cron:
  es-index:
    batch-size: 5
    reindex-batch-size: 5
  encryption:
    batch-size: 12
    
services:
  user: 
    url: http://user/micro
    group-url: http://user/auth/group
    user-key: http://user/user-key
  search:
    active: ES  # possible values [DB, ES]
    cron-url: http://search/cronjobs
  fileaccess-track:
    url: http://fileaccess-track/logging
  archive:
    url: http://archive/metadata
  template: 
    url: http://template/template
    micro: http://template/template-micro
  email-notification:
    url: http://notification/email-manager
  sms-notification:
    url: http://notification/sms-manager

jodconverter:
  local:
    enabled: true
    office-home:
    working-dir: C:\var\tmp\auradocsv4\temp
    process-timeout: 60000
    process-retry-interval: 250
    task-execution-timeout: 300000   # 5 min — covers large files up to ~100 MB
    task-queue-timeout: 300000
    max-tasks-per-process: 50
    port-numbers: 3002,3003,3004
    existing-process-action: connect_or_kill
    kill-existing-process: true

  large-file:
    port-numbers: 3010, 3011

    # environment-variables:
    #   PATH: "C:\\Program Files\\LibreOffice\\program;%PATH%"
    #   PYTHONHOME: "C:\\Program Files\\LibreOffice\\program\\python-core-3.12.13"
