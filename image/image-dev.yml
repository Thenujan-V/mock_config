    #   - "--nodefault"
    #   - "--nofirststartwizard"
    #   - "--norestore"


openapi:
  service:
    title: Image Service
    description: Image Processing related micro service for the AuraDOCS V4 
    version: 1.0.0-SNAPSHOT
    url: http://localhost:9191
  contact:
    name: AuraDOT PVT Ltd.
    email: contact@auradot.com
springdoc: 
  api-docs:
    path: /image/api-docs
  swagger-ui: 
    path: /image/swagger-ui.html

undersecretary:
  key:
    password: "auradocsuserkeystore"

auradoc:
  watermark:
  watermark-enabled: false

