spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/auradocs_auradot?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: auradocsv4
    password: Aura2528@
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
  elasticsearch:
    uris: http://elasticsearch:9200


archive:
  location: /var/tmp/auradocsv4
  identity: archive_1
  pending-docs:
    location: /var/tmp/auradocsv4/pending_docs
  signature-img: signature
  thumbs-location: /var/tmp/auradocsv4/thumbs
temp:
  location: /var/tmp/auradocsv4/temp
  auto-sign: sign
combinedDocs:
  location: /var/tmp/auradocsv4/temp
bookmark: 
  location: /var/tmp/bookmark

cron:
  es-index:
    batch-size: 1000
    reindex-batch-size: 500
  encryption:
    batch-size: 20
 
services:
  user: 
    url: http://user/micro
    group-url: http://user/auth/group
    user-key: http://user/user-key
  search:
    active: ES   # possible values [DB, ES]
    cron-url: http://search/cronjobs
  fileaccess-track:
    url: http://fileaccess-track/logging
  archive:
    url: http://archive/metadata
  template: 
    url: http://template/template
    micro: http://template/template-micro
  email-notification:
    url: http://notification/email-manager
  sms-notification:
    url: http://notification/sms-manager

link:
  external-viewer: https://v4.auradocs.com/viewer/

jodconverter:
  local:
    enabled: true
    office-home: /usr/lib/libreoffice
    working-dir: /var/tmp/auradocsv4/temp
    process-timeout: 60000
    process-retry-interval: 250
    task-execution-timeout: 300000   # 5 min — covers large files up to ~100 MB
    task-queue-timeout: 300000
    max-tasks-per-process: 5        # recycle LibreOffice process after 5 tasks
    port-numbers: 3002,3003, 3004

    environment-variables:
      PATH: "/usr/lib/libreoffice/program:$PATH"
    process-args:
      - "--headless"
      - "--invisible"
      - "--nologo"
      - "--nodefault"
      - "--nofirststartwizard"
      - "--nolockcheck"
      - "--norestore"


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka
    # healthcheck:
    #   enabled: true
  instance:
    preferIpAddress: true
    instance-id: ${spring.application.name}-${random.int}
    # hostname: localhost

member:
  rent:
    min: 8
    max: 31
  price:
    discount: 3
vehicle:
  default:
    model: cross over
duration: all

site: 
  file-share:
    url: http://api-service:8080/share-doc/view/

openapi:
  service:
    url: http://api-service:8080

auradoc:
  watermark:
  watermark-enabled: false