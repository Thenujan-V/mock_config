spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/auradocs_auradot?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: auradocsv4
    password: Aura2528@
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQL8Dialect
  data:
    elasticsearch:
      repositories:
        enabled: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://discovery-service:8761/eureka
    # healthcheck:
    #   enabled: true
  instance:
    preferIpAddress: true
    instance-id: ${spring.application.name}-${random.int}
    # hostname: localhost

services:
  archive:
    url: http://archive/metadata
  search: 
    active: ES  # possible values [DB, ES]
    cron-url: http://search/cronjobs
  fileaccess-track:
    url: http://fileaccess-track/logging
  template:
    micro-url: http://template/template-micro
  image:
    access-request: http://image/access-request

openapi:
  service:
    url: http://api-service:8080

keycloak:
  auth-server-url: http://keycloak:8080/auth
  realm: auraDOCS
  admin:
    username: auradocs@admin
    password: auraAdmin@123
    client-id: admin-cli
    client-secret: LVXL2Z0ZUZXJvf3pKxmixVyhE4pTFV4z
    session-client-id: auradocs

keycloak-sync:
  fixed-delay-ms: 900000 #The value should be in milliseconds, 900000 ms = 15 minutes

management:
  health:
    elasticsearch:
      enabled: false
    reactive-elasticsearch:
      enabled: false

auradocs:
  storage:
    provider: ${AURADOCS_STORAGE_PROVIDER:azure}   # local | s3 | azure
    archive-identity: archive_1
    pending-identity: pending_docs
    thumbs-identity: thumbs
    local:
      root-path: /var/tmp/auradocsv4
      temp-path: /var/tmp/auradocsv4/temp
    s3:
      endpoint: ${AURADOCS_S3_ENDPOINT:} # blank for AWS S3; http://localhost:9000 for MinIO
      region: ${AWS_REGION:}
      bucket: ${AWS_S3_BUCKET:}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      path-style-access: true                       # required for MinIO
      multipart-threshold-bytes: 16777216
    azure:
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}   # keep secret out of git
      container: ${AZURE_BLOB_CONTAINER:aura-docs-store}
      create-container-if-missing: true
