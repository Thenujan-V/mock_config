    #   - "--nologo"
    #   - "--nodefault"
    #   - "--nofirststartwizard"
    #   - "--nolockcheck"
    #   - "--norestore"
  
management: 
  tracing: 
    sampling: 
      probability: 1.0 

member:
  rent:
    min: 8
    max: 31
  price:
    discount: 3
vehicle:
  default:
    model: cross over
duration: all

openapi:
  service:
    title: Archive Service
    description: File Archive related micro service for the AuraDOCS V4
    version: 1.0.0-SNAPSHOT
    url: http://localhost:9191
  contact:
    name: AuraDOT PVT Ltd.
    email: contact@auradot.com
springdoc: 
  api-docs:
    path: /archive/api-docs
  swagger-ui: 
    path: /archive/swagger-ui.html
  
