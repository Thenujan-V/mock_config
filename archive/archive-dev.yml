spring:
  application:
    name: archive
  # profiles:
  #   active: dev
  banner: 
    location: classpath:banner.txt
  servlet:
    multipart:
      max-file-size: 120MB
      max-request-size: 120MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auradocs_auradot?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: Aura2528@
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
    # healthcheck:
    #   enabled: true
  instance:
    preferIpAddress: true
    instance-id: ${spring.application.name}-${random.int}
    # hostname: localhost

server:
  port: 0

services:
  authentication: http://authentication/services
  user:
    user-key: http://user/user-key
  template:
    url: http://template/template
    micro: http://template/template-micro
  image:
    admin: http://image/admin-image
  image-micro:
    micro: http://image/image-micro

locations:
  archive-files: /var/tmp/auradocsv4/pending_docs

mailbox:
  imap:
    uri: imaps://thenujan0726%40gmail.com:xkaoucarrhzzgcpd@imap.gmail.com:993/INBOX
    debug: false
    lookback-days: 1
    idle-interval-seconds: 600      # 10 minutes
    read-timeout-millis: 660000     # 11 minutes
  enabled: true

temp:
  location: /var/tmp/auradocsv4/temp
  signature: sign

jodconverter:
  local:
    enabled: true
    office-home: 
    working-dir: /var/tmp/auradocsv4/temp
    process-timeout: 60000
    process-retry-interval: 250
    task-execution-timeout: 600000
    task-queue-timeout: 300000
    max-tasks-per-process: 50
    port-numbers: 2002,2003,2004
    existing-process-action: connect_or_kill

  large-file:
    port-numbers: 2010,2011
    
    # environment-variables:
    #   PATH: "/usr/lib/libreoffice/program:$PATH"
