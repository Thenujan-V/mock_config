version: '4.0.1'

volumes:
  config_data:

services:

  # ── Init container ──────────────────────────────────────────────────────────
  # Builds the YAML image, copies files into the named volume, then exits (0).
  config-store:
    image: auradocsv4/auradocsv4_main:config-store-latest
    volumes:
      - config_data:/shared-configs
    restart: "no"                      # run-once; never auto-restart

