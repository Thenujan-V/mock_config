    cron-url: http://search/cronjobs
  

archive:
  location: /var/tmp/auradocsv4
  identity: archive_1
  pending-docs:
    location: /var/tmp/auradocsv4/pending_docs
  thumbs-location: /var/tmp/auradocsv4/thumbs
temp:
  location: /var/tmp/auradocsv4
  
  
openapi:
  service:
    url: http://api-service:8080


auradocs:
  storage:
    provider: ${AURADOCS_STORAGE_PROVIDER:local}   # local | s3 | azure
    archive-identity: archive_1
    pending-identity: pending_docs
    thumbs-identity: thumbs
    local:
      root-path: /var/tmp/auradocsv4
      temp-path: /var/tmp/auradocsv4/temp
    s3:
      endpoint: ${AURADOCS_S3_ENDPOINT:} # blank for AWS S3; http://localhost:9000 for MinIO
      region: ${AWS_REGION:}
      bucket: ${AWS_S3_BUCKET:}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      path-style-access: true                       # required for MinIO
      multipart-threshold-bytes: 16777216
    azure:
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}   # keep secret out of git
      container: ${AZURE_BLOB_CONTAINER:aura-docs-store}
      create-container-if-missing: true

management:
  tracing:
    sampling:
      probability: 0.3